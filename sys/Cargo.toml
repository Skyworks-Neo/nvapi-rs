[package]
name = "nvapi-sys"
version = "0.3.0"
publish = false
rust-version = "1.92"
authors = ["arcnmx"]
edition = "2021"

description = "NVIDIA NVAPI FFI bindings"
keywords = ["nvidia", "nvapi", "gtx"]

documentation = "https://docs.rs/nvapi-sys/"
repository = "https://github.com/arcnmx/nvapi-rs"
readme = "../README.md"
license = "MIT"

include = [
	"/src/**/*.rs",
	"/README*",
	"/COPYING*",
]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Com"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dependencies]
bitflags = "2"
serde = { version = "1", features = ["derive"], optional = true }
zerocopy = { version = "0.8", features = ["derive"] }
log = { version = "0.4", optional = true }
nvapi-macros = { version = "0.1", path = "../macros" }

[dev-dependencies]
serde_json = "1"

[features]
default = ["serde"]
serde = ["dep:serde", "bitflags/serde"]
log = ["dep:log"]
log-kv = ["log?/kv_unstable", "log?/kv_unstable_std"]
